<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>刘文辉 — 嵌入式工程师</title>
  <style>
    /* 全局样式：深色背景 + 轻微渐变 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 更现代的 sans-serif 字体栈：优先 Inter，其次系统现代字体 */
      font-family: "Inter", "SF Pro Display", "Segoe UI", "PingFang SC",
        "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      /* 深蓝色渐变背景 */
      background: linear-gradient(160deg, #0b1024 0%, #101a3c 40%, #0a2a5e 100%);
      color: #eaeaea;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      /* 名片卡片：半透明深色 + 渐变描边感 */
      background: rgba(20, 24, 40, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 48px 40px;
      /* 卡片自身的轻微渐变与阴影 */
      background-image: linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0) 60%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    /* 头像占位：渐变圆 */
    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      filter: drop-shadow(0 6px 18px rgba(79, 172, 254, 0.35));
      border: 3px solid rgba(255, 255, 255, 0.25);
    }

    h1 {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .role {
      margin-top: 8px;
      font-size: 15px;
      color: #4facfe;
      letter-spacing: 1px;
    }

    /* 分隔线 */
    .divider {
      width: 56px;
      height: 2px;
      margin: 24px auto;
      background: linear-gradient(90deg, transparent, #4facfe, transparent);
      border-radius: 2px;
    }

    /* 个人简介 */
    .bio {
      font-size: 14px;
      line-height: 1.8;
      color: #b8c0d0;
    }

    /* 技能标签区域 */
    .skills {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .skill-tag {
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      background: rgba(79, 172, 254, 0.12);
      border: 1px solid rgba(79, 172, 254, 0.35);
      color: #7cc4ff;
      cursor: default;
      /* 过渡所有可动画属性 */
      transition: transform 0.25s ease, box-shadow 0.25s ease,
        background 0.25s ease, color 0.25s ease;
    }

    /* 悬停动画：上浮 + 发光 + 渐变色增强 */
    .skill-tag:hover {
      transform: translateY(-4px) scale(1.08);
      background: linear-gradient(135deg, rgba(79, 172, 254, 0.35), rgba(0, 242, 254, 0.35));
      border-color: rgba(0, 242, 254, 0.65);
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(79, 172, 254, 0.4);
    }

    /* 底部版权 */
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #5a6273;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 渐变头像占位 -->
    <div class="avatar"></div>

    <!-- 姓名与职业 -->
    <h1>刘文辉</h1>
    <p class="role">嵌入式工程师</p>

    <div class="divider"></div>

    <!-- 个人简介 -->
    <p class="bio">
      专注于嵌入式系统开发，热衷硬件与软件的交汇点。
      相信一行优秀的代码和一块稳定的电路同样重要。
    </p>

    <!-- 技能标签 -->
    <div class="skills">
      <span class="skill-tag">C</span>
      <span class="skill-tag">Python</span>
      <span class="skill-tag">STM32</span>
    </div>

    <div class="footer">© 刘文辉 · 嵌入式工程师</div>
  </div>
</body>
</html>
